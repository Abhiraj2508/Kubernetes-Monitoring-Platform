
apiVersion: apps/v1
kind: Deployment

metadata:
  name: web-demo
  labels:
    app: web-demo

spec:
  replicas: 4

  selector:
    matchLabels:
      app: web-demo

  template:
    metadata:
      labels:
        app: web-demo

    spec:
      containers:
        - name: nginx
          image: nginx:alpine

          ports:
            - containerPort: 80

          # ConfigMap Integration
          envFrom:
            - configMapRef:
                name: web-demo-config
            
            
          env:
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: API_TOKEN

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: DB_PASSWORD


          # Health Checks
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5

          # CPU and Memory Management
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "250m"
