
# Kubernetes Monitoring Platform - Helm Values

replicaCount: 4

# Docker Image Configuration
image:
  repository: nginx
  pullPolicy: IfNotPresent
  tag: "alpine"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Service Account
serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

# Pod Configuration
podAnnotations: {}
podLabels: {}

podSecurityContext: {}
securityContext: {}

# Kubernetes Service
service:
  type: ClusterIP
  port: 80

# Ingress Configuration
ingress:
  enabled: true
  className: nginx
  annotations: {}
  hosts:
    - host: helm-demo.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# HTTP Route
httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
    - name: gateway
      sectionName: http
  hostnames:
    - chart-example.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /headers

# CPU and Memory Resources
resources:
  requests:
    memory: "64Mi"
    cpu: "100m"
  limits:
    memory: "128Mi"
    cpu: "250m"

# Health Checks
livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5

# Autoscaling
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

# Volumes
volumes: []
volumeMounts: []

# Scheduling
nodeSelector: {}
tolerations: []
affinity: {}


# Application Configuration
config:
  appName: "Kubernetes Monitoring Platform"
  appEnv: "development"
  appVersion: "1.0"


# Demo Secret Configuration
# Use dummy credentials only. Never commit real secrets.
secret:
  apiToken: "local-demo-token"
  dbPassword: "demo-password-123"
